<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafe Express</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:         #D4AF37;
            --gold-light:   #F3E5AB;
            --gold-dark:    #997A15;
            --gold-glow:    rgba(212, 175, 55, 0.35);

            --black:        #0A0A0B;
            --black-soft:   #141416;
            --card-dark:    #1C1B1E;
            --card-hover:   #252428;
            --bg-input:     #1C1B1E;

            --text-light:   #F5F5F7;
            --text-muted:   #A39988;
            --border-gold:  rgba(212, 175, 55, 0.25);
            --border-subtle:rgba(255, 255, 255, 0.08);

            --radius:       16px;
            --radius-full:  9999px;
            --transition:   all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── LIGHT THEME OVERRIDES ── */
        body.light-theme {
            --black:        #F4F5F7;
            --black-soft:   #FFFFFF;
            --card-dark:    #FFFFFF;
            --card-hover:   #F9FAFB;
            --bg-input:     #F3F4F6;

            --text-light:   #111827;
            --text-muted:   #4B5563;
            --border-gold:  rgba(184, 134, 11, 0.35);
            --border-subtle:rgba(0, 0, 0, 0.08);
            background-color: var(--black);
            color: var(--text-light);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--black);
            color: var(--text-light);
            padding-bottom: 100px;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ── HEADER ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 16px;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gold);
            transform: translateZ(0);
            transition: var(--transition);
        }

        body.light-theme .header {
            background: rgba(255, 255, 255, 0.95);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
            flex-shrink: 0;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .header-sub {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            display: block;
            margin-top: -2px;
        }

        /* ── HEADER CONTROLS (THEME & LANG) ── */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-gold);
            background: var(--card-dark);
            color: var(--gold);
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle-btn:active {
            transform: scale(0.92);
        }

        .mini-lang-selector {
            display: flex;
            background: var(--card-dark);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-full);
            padding: 2px;
            gap: 2px;
        }

        .mini-lang-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition);
        }

        .mini-lang-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0A0B;
            box-shadow: 0 2px 6px var(--gold-glow);
        }

        /* ── CATEGORIES ── */
        .category-tabs {
            display: flex;
            overflow-x: auto;
            padding: 14px 16px 6px;
            gap: 8px;
            scroll-behavior: smooth;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        .tab {
            padding: 7px 16px;
            background: var(--card-dark);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 600;
            font-size: 12.5px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .tab.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0A0B;
            border-color: transparent;
            box-shadow: 0 4px 14px var(--gold-glow);
            transform: translateY(-1px);
        }

        /* ── MENU GRID ── */
        .menu-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 10px 16px 0;
        }

        .menu-item {
            background: var(--card-dark);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .menu-item:active { transform: scale(0.97); }
        .menu-item.in-cart {
            border-color: var(--gold);
            box-shadow: 0 0 16px var(--gold-glow);
        }

        .img-container {
            width: 100%;
            height: 125px;
            overflow: hidden;
            position: relative;
            background-color: #24221A;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .item-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            gap: 8px;
        }

        .item-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-light);
            line-height: 1.3;
        }

        .item-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .item-price {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--gold);
        }

        .add-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            color: #0A0A0B;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--gold-glow);
        }
        .add-btn:active { transform: scale(0.9); }

        .qty-controls {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--card-hover);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-full);
            padding: 2px 4px;
        }
        .menu-item.in-cart .add-btn { display: none; }
        .menu-item.in-cart .qty-controls { display: flex; }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--card-dark);
            border: 1px solid var(--border-gold);
            color: var(--gold);
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .qty-val {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-light);
            min-width: 16px;
            text-align: center;
        }

        /* ── BOTTOM BAR ── */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-dark);
            border-top: 1px solid var(--border-gold);
            padding: 12px 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 90;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .bottom-bar.visible { transform: translateY(0); }

        .cart-info {
            display: flex;
            flex-direction: column;
        }
        .cart-count {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .cart-total {
            font-size: 17px;
            font-weight: 800;
            color: var(--gold);
        }

        .checkout-btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0A0B;
            border: none;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--gold-glow);
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-dark);
            border-top: 1px solid var(--border-gold);
            border-radius: 24px 24px 0 0;
            padding: 20px 20px 32px;
            max-height: 88vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--border-gold);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .modal-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--gold);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .cart-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .cart-list-item-name { font-weight: 600; flex: 1; }
        .cart-list-item-qty { color: var(--gold); font-weight: 700; margin: 0 12px; }
        .cart-list-item-price { font-weight: 700; }

        /* Payment selector */
        .payment-method {
            margin-bottom: 18px;
        }
        .payment-method p {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .pay-opt {
            padding: 10px;
            border: 1px solid var(--border-gold);
            background: var(--card-hover);
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .pay-opt.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0A0B;
            border-color: transparent;
            box-shadow: 0 2px 10px var(--gold-glow);
        }

        /* Form inputs */
        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-gold);
            background: var(--bg-input);
            color: var(--text-light);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .loc-btn {
            padding: 10px;
            border-radius: 12px;
            border: 1px dashed var(--border-gold);
            background: var(--card-hover);
            color: var(--gold);
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            transition: var(--transition);
        }
        .loc-btn.done {
            border-style: solid;
            background: rgba(16, 185, 129, 0.15);
            border-color: #10B981;
            color: #10B981;
        }

        .card-details {
            background: var(--card-hover);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 12px;
            margin-top: 6px;
        }
        .card-details p {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .card-box {
            background: var(--card-dark);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .card-box strong { font-size: 15px; color: var(--gold); letter-spacing: 1px; }

        .final-checkout-btn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0A0B;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 18px var(--gold-glow);
        }
        .final-checkout-btn:disabled { opacity: 0.6; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-brand">
            <div class="header-logo">
                <img src="/static/cafe_logo.png" alt="Logo">
            </div>
            <div>
                <h3>Cafe Express</h3>
                <span class="header-sub" id="header-sub-text">Tez yetkazib berish</span>
            </div>
        </div>

        <div class="header-controls">
            <!-- Theme toggle button -->
            <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="Rejim">🌙</button>

            <!-- Language selector -->
            <div class="mini-lang-selector">
                <button class="mini-lang-btn active" data-lang="uz" onclick="setAppLang('uz')">UZ</button>
                <button class="mini-lang-btn" data-lang="ru" onclick="setAppLang('ru')">RU</button>
                <button class="mini-lang-btn" data-lang="en" onclick="setAppLang('en')">EN</button>
            </div>
        </div>
    </div>

    <div id="promo-banner-container"></div>

    <div class="category-tabs" id="categories">
        <div class="tab" style="width: 80px; height: 32px;"></div>
    </div>

    <div class="menu-list" id="menu-items">
        <div class="menu-item" style="height: 220px;"></div>
        <div class="menu-item" style="height: 220px;"></div>
    </div>

    <!-- Bottom Cart Floating Bar -->
    <div class="bottom-bar" id="bottom-bar">
        <div class="cart-info">
            <span class="cart-count">🛒 <span id="cart-count">0</span> <span id="cart-count-lbl">ta mahsulot</span></span>
            <span class="cart-total"><span id="cart-total">0</span> <span class="currency-unit">so'm</span></span>
        </div>
        <button class="checkout-btn" id="btn-open-cart" onclick="openModal()">Savat →</button>
    </div>

    <!-- Success Screen Overlay -->
    <div id="success-overlay" style="display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:linear-gradient(135deg,#0d0d0d,#1a1500); z-index:9999; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px;">
        <div style="width:90px;height:90px; background:linear-gradient(135deg,#D4AF37,#997A15); border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:42px; margin-bottom:20px; box-shadow: 0 0 30px rgba(212,175,55,0.5);">✅</div>
        <h2 id="success-title" style="font-family:'Playfair Display',serif; color:#D4AF37; font-size:24px; margin-bottom:8px;">Buyurtma qabul qilindi!</h2>
        <p id="success-sub" style="color:#A39988;font-size:13.5px;margin-bottom:10px;">Admin tasdiqlashini kutmoqda...</p>
        <p id="success-notify" style="color:#78716C;font-size:12px;">Tasdiqlangach Telegramda xabar olasiz</p>
    </div>

    <!-- Cart / Checkout Modal -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="modal-cart-title">🛒 Savatcha</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="cart-list" id="modal-cart-list"></div>

            <div class="payment-method">
                <p id="lbl-payment-title">To'lov turini tanlang:</p>
                <div class="payment-options">
                    <div class="pay-opt active" onclick="setPayment('Karta')" id="pay-karta">💳 Karta</div>
                    <div class="pay-opt" onclick="setPayment('Naqd')" id="pay-naqd">💵 Naqd</div>
                </div>
            </div>

            <div class="checkout-form">
                <input type="tel" id="form-phone" placeholder="Telefon raqam (+998901234567)" class="form-input">
                <input type="text" id="form-address" placeholder="Manzil (Tuman, ko'cha, uy...)" class="form-input">
                <button type="button" class="loc-btn" id="loc-btn" onclick="getLocation()">
                    📍 Lokatsiyani aniqlash
                </button>
                <small id="loc-status" style="display:block;margin-top:4px;color:var(--text-muted);"></small>

                <div id="card-details" class="card-details">
                    <p id="lbl-card-transfer">Karta raqamiga pul o'tkazing:</p>
                    <div class="card-box">
                        <strong id="card-num-text">8600 0000 0000 0000</strong><br>
                        <small id="card-name-text">Ism Familiya</small>
                    </div>
                    <p id="lbl-card-receipt" style="margin-top:10px;">To'lov chekini yuklang:</p>
                    <input type="file" id="form-receipt" accept="image/*" class="form-input">
                </div>
            </div>

            <button class="final-checkout-btn" id="submit-btn" onclick="checkout()">
                <span id="btn-submit-text">Buyurtma berish</span> — <span id="modal-total">0</span> <span class="currency-unit">so'm</span>
            </button>
        </div>
    </div>

                order_success: "Заказ принят!",
                order_success_sub: "Ожидает подтверждения админа...",
                order_notify: "Вы получите уведомление в Telegram",
                currency: "сум",
                fill_phone: "Пожалуйста, введите номер телефона!",
                fill_address: "Пожалуйста, укажите ваш адрес!",
                upload_receipt: "Пожалуйста, прикрепите чек оплаты!"
            },
            en: {
                header_sub: "Fast Delivery",
                cart_btn: "Cart →",
                cart_items: "items",
                cart_title: "🛒 Cart",
                payment_title: "Choose Payment Method:",
                pay_card: "💳 Card",
                pay_cash: "💵 Cash",
                phone_placeholder: "Phone number (+998901234567)",
                address_placeholder: "Address (Street, building...)",
                loc_btn: "📍 Detect Location",
                loc_done: "✅ Location detected!",
                card_transfer: "Transfer to card number:",
                card_receipt: "Upload payment receipt:",
                order_submit: "Place Order",
                discounts_tab: "🏷️ Discounts",
                empty_cat: "No items available in this category",
                order_success: "Order received!",
                order_success_sub: "Waiting for admin confirmation...",
                order_notify: "You will receive a Telegram notification",
                currency: "UZS",
                fill_phone: "Please enter your phone number!",
                fill_address: "Please enter your delivery address!",
                upload_receipt: "Please upload the payment receipt!"
            }
        };

        let currentLang = localStorage.getItem('webapp_lang') || 'uz';
        let currentTheme = localStorage.getItem('webapp_theme') || 'dark';

        function t(key) {
            const dict = appI18n[currentLang] || appI18n.uz;
            return dict[key] || key;
        }

        function setAppLang(lang) {
            if (!appI18n[lang]) lang = 'uz';
            currentLang = lang;
            localStorage.setItem('webapp_lang', lang);

            // Update mini lang buttons
            document.querySelectorAll('.mini-lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === lang);
            });

            applyAppTranslations();
            renderCategories(cachedCategories);
            updateCart();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('webapp_theme', currentTheme);
            applyTheme();
        }

        function applyTheme() {
            const isLight = currentTheme === 'light';
            document.body.classList.toggle('light-theme', isLight);
            const btn = document.getElementById('theme-btn');
            if (btn) btn.textContent = isLight ? '☀️' : '🌙';
        }

        function applyAppTranslations() {
            const setTxt = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            };

            setTxt('header-sub-text', t('header_sub'));
            setTxt('btn-open-cart', t('cart_btn'));
            setTxt('cart-count-lbl', t('cart_items'));
            setTxt('modal-cart-title', t('cart_title'));
            setTxt('lbl-payment-title', t('payment_title'));
            setTxt('pay-karta', t('pay_card'));
            setTxt('pay-naqd', t('pay_cash'));
            setTxt('lbl-card-transfer', t('card_transfer'));
            setTxt('lbl-card-receipt', t('card_receipt'));
            setTxt('btn-submit-text', t('order_submit'));
            setTxt('success-title', t('order_success'));
            setTxt('success-sub', t('order_success_sub'));
            setTxt('success-notify', t('order_notify'));

            const phoneInput = document.getElementById('form-phone');
            if (phoneInput) phoneInput.placeholder = t('phone_placeholder');

            const addrInput = document.getElementById('form-address');
            if (addrInput) addrInput.placeholder = t('address_placeholder');

            const locBtn = document.getElementById('loc-btn');
            if (locBtn && !userLat) locBtn.textContent = t('loc_btn');

            document.querySelectorAll('.currency-unit').forEach(el => el.textContent = t('currency'));
        }

        // Apply theme immediately
        applyTheme();

        let allItems = [];
        let cachedCategories = [];
        let cart = {};
        let globalSettings = {};
        let userLat = null;
        let userLon = null;
        let activeCategoryId = null;

        function applyPromotions(menu, promotions) {
            if (!promotions || promotions.length === 0) return menu;

            promotions.forEach(p => {
                const discount = p.discount_percent || 0;
                if (discount <= 0) return;

                menu.forEach(item => {
                    const matchesItem = p.menu_item_id && Number(p.menu_item_id) === Number(item.id);
                    const matchesCategory = p.category_id && Number(p.category_id) === Number(item.category_id);
                    const isGeneral = (!p.category_id || p.category_id === '') && (!p.menu_item_id || p.menu_item_id === '');

                    if (matchesItem || matchesCategory || isGeneral) {
                        if (!item.old_price || item.old_price <= item.price) {
                            item.old_price = item.price;
                        }
                        item.price = Math.round(item.old_price * (1 - discount / 100));
                        item.promo_title = p.title;
                        item.discount_percent = discount;
                    }
                });
            });
            return menu;
        }

        function renderPromoBanner(promotions) {
            const container = document.getElementById('promo-banner-container');
            if (!container) return;
            if (!promotions || promotions.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            promotions.forEach(p => {
                html += `
                    <div style="margin: 8px 16px; padding: 10px 14px; background: linear-gradient(135deg, rgba(212, 175, 55, 0.18), rgba(239, 68, 68, 0.22)); border: 1px solid var(--border-gold); border-radius: 14px; display: flex; align-items: center; justify-content: space-between;">
                        <div style="flex:1;">
                            <div style="color: var(--gold-light); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px;">
                                <span style="background:#EF4444; color:#ffffff; font-size:9.5px; font-weight:bold; padding:2px 6px; border-radius:4px;">PROMO</span>
                                🎁 ${p.title} ${p.discount_percent ? '(' + p.discount_percent + '%)' : ''}
                            </div>
                            <div style="color: var(--text-muted); font-size: 11px; margin-top: 2px;">${p.description || ''}</div>
                        </div>
                        <span style="font-size: 22px;">🔥</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function init() {
            try {
                // Set language buttons
                document.querySelectorAll('.mini-lang-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.lang === currentLang);
                });
                applyAppTranslations();

                const res = await fetch('/api/data');
                const data = await res.json();

                allItems = applyPromotions(data.menu || [], data.promotions || []);
                cachedCategories = data.categories || [];
                globalSettings = data.settings || {};

                renderPromoBanner(data.promotions);

                document.getElementById('card-num-text').innerText = globalSettings.card_number || '8600 0000 0000 0000';
                document.getElementById('card-name-text').innerText = globalSettings.card_name || 'Cafe Express';

                renderCategories(cachedCategories);

                const savedPhone = localStorage.getItem('user_phone');
                if (savedPhone) {
                    document.getElementById('form-phone').value = savedPhone;
                }

                getLocation(true);
            } catch (e) {
                console.error("Error loading data", e);
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('categories');
            if (!container) return;
            container.innerHTML = '';

            const hasPromoItems = allItems.some(i => i.old_price && i.old_price > i.price);
            if (hasPromoItems) {
                const promoDiv = document.createElement('div');
                promoDiv.className = `tab ${activeCategoryId === 'promo' ? 'active' : ''}`;
                promoDiv.innerText = t('discounts_tab');
                promoDiv.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    promoDiv.classList.add('active');
                    activeCategoryId = 'promo';
                    renderMenu('promo');
                };
                container.appendChild(promoDiv);
            }

            categories.forEach((c, index) => {
                const div = document.createElement('div');
                const isSelected = activeCategoryId === c.id || (!activeCategoryId && !hasPromoItems && index === 0);
                div.className = `tab ${isSelected ? 'active' : ''}`;
                div.innerText = c.name;
                div.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    div.classList.add('active');
                    activeCategoryId = c.id;
                    renderMenu(c.id);
                };
                container.appendChild(div);
            });

            if (!activeCategoryId) {
                if (hasPromoItems) {
                    activeCategoryId = 'promo';
                    renderMenu('promo');
                } else if (categories.length > 0) {
                    activeCategoryId = categories[0].id;
                    renderMenu(categories[0].id);
                }
            } else {
                renderMenu(activeCategoryId);
            }
        }

        function renderMenu(categoryId) {
            const container = document.getElementById('menu-items');
            if (!container) return;
            container.innerHTML = '';

            let filtered = [];
            if (categoryId === 'promo') {
                filtered = allItems.filter(i => i.old_price && i.old_price > i.price);
            } else {
                filtered = allItems.filter(i => i.category_id === categoryId);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); grid-column: 1 / -1;">${t('empty_cat')}</div>`;
                return;
            }

            const curr = t('currency');

            filtered.forEach(item => {
                const inCart = cart[item.id] ? cart[item.id].qty : 0;

                const div = document.createElement('div');
                div.className = `menu-item ${inCart > 0 ? 'in-cart' : ''}`;
                div.id = `item-${item.id}`;

                const imgUrl = item.image_url && item.image_url.startsWith('http') ?
                               item.image_url :
                               (item.image_url ? '/static/uploads/' + item.image_url : 'https://placehold.co/300x200/18181b/D4AF37?text=Cafe+Express');

                const isPromo = item.old_price && item.old_price > item.price;
                const badgeHtml = isPromo ? `
                    <div style="position:absolute; top:8px; left:8px; background:linear-gradient(135deg, #EF4444, #DC2626); color:#ffffff; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:6px; z-index:2;">
                        🏷️ PROMO
                    </div>
                ` : '';

                const priceHtml = isPromo ? `
                    <span class="item-price">
                        ${item.price.toLocaleString()}
                        <s style="color:var(--text-muted); font-size:10.5px; font-weight:normal; margin-left:3px; text-decoration:line-through;">${item.old_price.toLocaleString()}</s> ${curr}
                    </span>
                ` : `
                    <span class="item-price">${item.price.toLocaleString()} ${curr}</span>
                `;

                div.innerHTML = `
                    <div class="img-container">
                        ${badgeHtml}
                        <img src="${imgUrl}" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/300x200/18181b/D4AF37?text=Food'">
                    </div>
                    <div class="item-info">
                        <div>
                            <h4 class="item-name">${item.name}</h4>
                            <p class="item-desc">${item.description || ''}</p>
                        </div>
                        <div class="price-row">
                            ${priceHtml}
                            <button class="add-btn" onclick="add(${item.id})">+</button>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="minus(${item.id})">−</button>
                                <span class="qty-val" id="qty-${item.id}">${inCart}</span>
                                <button class="qty-btn" onclick="add(${item.id})">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function add(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;
            if (!cart[id]) {
                cart[id] = { item: item, qty: 1 };
                const itemEl = document.getElementById(`item-${id}`);
                if (itemEl) itemEl.classList.add('in-cart');
            } else {
                cart[id].qty++;
            }
            const qtyEl = document.getElementById(`qty-${id}`);
            if (qtyEl) qtyEl.innerText = cart[id].qty;
            updateCart();
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
            }
        }

        function minus(id) {
            if (cart[id]) {
                cart[id].qty--;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                    const itemEl = document.getElementById(`item-${id}`);
                    if (itemEl) itemEl.classList.remove('in-cart');
                } else {
                    const qtyEl = document.getElementById(`qty-${id}`);
                    if (qtyEl) qtyEl.innerText = cart[id].qty;
                }
                updateCart();
                if (tg && tg.HapticFeedback) {
                    try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
                }
            }
        }

        function updateCart() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                total += cart[id].item.price * cart[id].qty;
                count += cart[id].qty;
            }

            const countEl = document.getElementById('cart-count');
            if (countEl) countEl.innerText = count;

            const totalEl = document.getElementById('cart-total');
            if (totalEl) totalEl.innerText = total.toLocaleString();

            const modalTotalEl = document.getElementById('modal-total');
            if (modalTotalEl) modalTotalEl.innerText = total.toLocaleString();

            const bottomBar = document.getElementById('bottom-bar');
            if (bottomBar) {
                if (count > 0) {
                    bottomBar.classList.add('visible');
                } else {
                    bottomBar.classList.remove('visible');
                    closeModal();
                }
            }
        }

        let selectedPayment = 'Karta';

        function setPayment(method) {
            selectedPayment = method;
            const payKarta = document.getElementById('pay-karta');
            const payNaqd = document.getElementById('pay-naqd');
            if (payKarta) payKarta.classList.toggle('active', method === 'Karta');
            if (payNaqd) payNaqd.classList.toggle('active', method === 'Naqd');
            const cardDet = document.getElementById('card-details');
            if (cardDet) cardDet.style.display = (method === 'Karta') ? 'block' : 'none';
        }

        function openModal() {
            const list = document.getElementById('modal-cart-list');
            if (!list) return;
            let html = '';
            const curr = t('currency');
            for (let id in cart) {
                const c = cart[id];
                html += `
                    <div class="cart-list-item">
                        <div class="cart-list-item-name">${c.item.name}</div>
                        <div class="cart-list-item-qty">${c.qty} x</div>
                        <div class="cart-list-item-price">${(c.item.price * c.qty).toLocaleString()} ${curr}</div>
                    </div>
                `;
            }
            list.innerHTML = html;
            const cartModal = document.getElementById('cart-modal');
            if (cartModal) cartModal.classList.add('active');

            if (!userLat || !userLon) {
                getLocation(false);
            }
        }

        function closeModal() {
            const cartModal = document.getElementById('cart-modal');
            if (cartModal) cartModal.classList.remove('active');
        }

        function getLocation(isSilent = false) {
            const btn = document.getElementById('loc-btn');
            const status = document.getElementById('loc-status');

            if (!isSilent && btn) {
                btn.innerText = '⏳ ...';
            }

            if (!navigator.geolocation) {
                if (!isSilent && btn) {
                    btn.innerText = t('loc_btn');
                }
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    if (btn) {
                        btn.innerText = t('loc_done');
                        btn.classList.add('done');
                    }
                    if (status) status.innerText = `${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;

                    const addrInput = document.getElementById('form-address');
                    if (addrInput && !addrInput.value) {
                        addrInput.value = `GPS: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
                    }
                },
                (err) => {
                    if (!isSilent && btn) {
                        btn.innerText = t('loc_btn');
                    }
                },
                { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
            );
        }

        function getTelegramUserId() {
            try {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                    const uid = String(tg.initDataUnsafe.user.id);
                    if (uid !== '0') {
                        localStorage.setItem('tg_user_id', uid);
                        return uid;
                    }
                }
            } catch(e) {}
            const urlParams = new URLSearchParams(window.location.search);
            const qUser = urlParams.get('user_id') || urlParams.get('tgWebAppStartParam');
            if (qUser && String(qUser) !== '0') {
                localStorage.setItem('tg_user_id', String(qUser));
                return String(qUser);
            }
            const savedId = localStorage.getItem('tg_user_id');
            if (savedId && savedId !== '0') return savedId;
            return '0';
        }

        function compressAndGetBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        setTimeout(() => {
                            try {
                                const canvas = document.createElement('canvas');
                                const MAX_SIZE = 600;
                                let w = img.width, h = img.height;
                                if (w > MAX_SIZE || h > MAX_SIZE) {
                                    if (w > h) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
                                    else { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }
                                }
                                canvas.width = w;
                                canvas.height = h;
                                const ctx = canvas.getContext('2d');
                                ctx.fillStyle = "#FFFFFF";
                                ctx.fillRect(0, 0, w, h);
                                ctx.drawImage(img, 0, 0, w, h);
                                resolve(canvas.toDataURL('image/jpeg', 0.5));
                            } catch(err) {
                                reject(err);
                            }
                        }, 20);
                    };
                    img.onerror = () => reject(new Error("Rasm o'qib bo'lmadi"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Fayl xatosi"));
                reader.readAsDataURL(file);
            });
        }

        async function checkout() {
            const phoneEl = document.getElementById('form-phone');
            const addressEl = document.getElementById('form-address');
            const phone = phoneEl ? phoneEl.value.trim() : '';
            const address = addressEl ? addressEl.value.trim() : '';

            if (!phone) {
                if (tg && tg.showAlert) tg.showAlert(t('fill_phone'));
                else alert(t('fill_phone'));
                return;
            }
            if (!address) {
                if (tg && tg.showAlert) tg.showAlert(t('fill_address'));
                else alert(t('fill_address'));
                return;
            }

            localStorage.setItem('user_phone', phone);

            const btn = document.getElementById('submit-btn');
            if (!btn) return;
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;

            const receiptInput = document.getElementById('form-receipt');
            let receiptBase64 = null;

            if (selectedPayment === 'Karta') {
                if (!receiptInput || receiptInput.files.length === 0) {
                    if (tg && tg.showAlert) tg.showAlert(t('upload_receipt'));
                    else alert(t('upload_receipt'));
                    btn.disabled = false;
                    return;
                }
                btn.innerText = "📎 ...";
                try {
                    receiptBase64 = await compressAndGetBase64(receiptInput.files[0]);
                } catch(e) {
                    btn.disabled = false;
                    btn.innerHTML = originalBtnText;
                    return;
                }
            }

            btn.innerText = "⏳ ...";

            const orderItems = Object.values(cart).map(c => ({ id: c.item.id, qty: c.qty, price: c.item.price }));
            const userId = getTelegramUserId();

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        phone: phone,
                        address: address,
                        payment_method: selectedPayment,
                        items: orderItems,
                        latitude: userLat || 0,
                        longitude: userLon || 0,
                        receipt_base64: receiptBase64
                    })
                });

                const data = await response.json();
                if (data.success) {
                    cart = {};
                    updateCart();
                    closeModal();

                    const successOverlay = document.getElementById('success-overlay');
                    if (successOverlay) {
                        successOverlay.style.display = 'flex';
                    }

                    setTimeout(() => {
                        if (tg) {
                            try { tg.close(); } catch(e) {}
                        }
                    }, 3500);
                } else {
                    alert(data.error || "Xatolik yuz berdi");
                    btn.disabled = false;
                    btn.innerHTML = originalBtnText;
                }
            } catch(e) {
                alert("Internet aloqasini tekshiring.");
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        }

        window.onload = init;
    </script>
</body>
