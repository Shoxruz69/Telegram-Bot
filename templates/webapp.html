<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafe Express</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:       #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark:  #997A15;
            --black:      #0A0A0B;
            --black-soft: #141416;
            --card-dark:  #1C1B1E;
            --cream:      #FFFFFF;
            --cream-muted:#E6DEC4;
            --text-light: #F5F5F7;
            --text-muted: #A39988;
            --radius:     16px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--black);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 20px;
            background: rgba(17,17,17,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(201,162,39,0.25);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 12px rgba(201,162,39,0.4);
        }

        .header h3 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .header-sub {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            display: block;
            margin-top: -2px;
            -webkit-text-fill-color: var(--text-muted);
        }

        /* ── CATEGORIES ── */
        .category-tabs {
            display: flex;
            overflow-x: auto;
            padding: 16px 20px 8px;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        .tab {
            padding: 8px 20px;
            background: var(--card-dark);
            border: 1px solid rgba(201,162,39,0.15);
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .tab.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--black);
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(201,162,39,0.45);
            transform: translateY(-2px);
        }

        /* ── MENU GRID ── */
        .menu-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 10px 16px 0;
        }

        .menu-item {
            background: #1e1e1e;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(201,162,39,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .menu-item:active { transform: scale(0.97); }
        .menu-item.in-cart {
            border-color: var(--gold);
            box-shadow: 0 0 16px rgba(201,162,39,0.25);
            background: #24221a;
        }

        .img-container {
            width: 100%;
            height: 130px;
            overflow: hidden;
            position: relative;
            background: #1a1a1a;
        }
        .menu-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .menu-item:hover img { transform: scale(1.07); }

        /* Gold shimmer overlay on image */
        .img-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(17,17,17,0.55) 0%, transparent 60%);
            pointer-events: none;
        }

        .item-info {
            padding: 10px 12px 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 3px 0;
            line-height: 1.2;
            color: var(--cream);
        }
        .item-desc {
            font-size: 10.5px;
            color: var(--text-muted);
            margin: 0 0 8px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        .item-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold-light);
        }

        /* ── ADD / QTY BUTTONS ── */
        .add-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--black);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(201,162,39,0.4);
            transition: 0.2s;
        }
        .add-btn:active { transform: scale(0.88); }

        .qty-controls {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(201,162,39,0.1);
            border-radius: 9px;
            padding: 2px 4px;
            border: 1px solid rgba(201,162,39,0.3);
        }
        .qty-btn {
            background: transparent;
            color: var(--gold-light);
            border: none;
            width: 26px;
            height: 26px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
        }
        .qty-val {
            font-weight: 700;
            font-size: 13px;
            min-width: 14px;
            text-align: center;
            color: var(--gold-light);
        }
        .menu-item.in-cart .add-btn { display: none; }
        .menu-item.in-cart .qty-controls { display: flex; }

        /* ── BOTTOM CART BAR ── */
        .bottom-bar {
            position: fixed;
            bottom: 14px;
            left: 16px;
            right: 16px;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: var(--black);
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(201,162,39,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .bottom-bar.visible { transform: translateY(0); }

        .cart-info { display: flex; flex-direction: column; }
        .cart-count { font-size: 11px; opacity: 0.75; font-weight: 600; }
        .cart-total { font-size: 17px; font-weight: 800; }

        .checkout-btn {
            background: var(--black);
            color: var(--gold-light);
            border: none;
            padding: 9px 22px;
            border-radius: 13px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        /* ── SKELETON ── */
        .skeleton {
            background: linear-gradient(90deg, #242424 25%, #2e2e2e 50%, #242424 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: block; opacity: 1; }

        .modal-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: var(--black-soft);
            border-radius: 24px 24px 0 0;
            border-top: 2px solid rgba(201,162,39,0.35);
            padding: 20px 20px 30px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(201,162,39,0.35);
            border-radius: 4px;
            margin: 0 auto 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-light);
            font-family: 'Playfair Display', serif;
        }
        .close-btn {
            background: rgba(201,162,39,0.1);
            border: 1px solid rgba(201,162,39,0.25);
            width: 32px; height: 32px;
            border-radius: 50%;
            font-weight: bold;
            color: var(--gold-light);
            cursor: pointer;
            font-size: 14px;
        }

        .cart-list { margin-bottom: 18px; }
        .cart-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(201,162,39,0.1);
        }
        .cart-list-item-name { font-weight: 600; font-size: 13px; flex: 1; color: var(--cream); }
        .cart-list-item-qty  { font-weight: 700; color: var(--gold); margin: 0 12px; font-size: 13px; }
        .cart-list-item-price{ font-weight: 700; font-size: 13px; color: var(--gold-light); }

        /* ── PAYMENT OPTIONS ── */
        .payment-method { margin-bottom: 16px; }
        .payment-method p { font-weight: 600; margin-bottom: 10px; font-size: 14px; color: var(--text-muted); }
        .payment-options { display: flex; gap: 10px; }
        .pay-opt {
            flex: 1;
            padding: 11px;
            text-align: center;
            border: 2px solid rgba(201,162,39,0.2);
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-muted);
            background: var(--card-dark);
        }
        .pay-opt.active {
            border-color: var(--gold);
            background: rgba(201,162,39,0.12);
            color: var(--gold-light);
        }

        /* ── FORM INPUTS ── */
        .form-input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 10px;
            border: 1px solid rgba(201,162,39,0.2);
            border-radius: 10px;
            font-size: 13px;
            background: var(--card-dark);
            color: var(--cream);
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--gold); }
        .form-input::placeholder { color: var(--text-muted); }

        /* ── CARD DETAILS ── */
        .card-details {
            margin-top: 14px;
            padding: 14px;
            background: rgba(201,162,39,0.07);
            border-radius: 12px;
            border: 1px dashed rgba(201,162,39,0.4);
        }
        .card-details p { margin: 0 0 8px; font-size: 13px; color: var(--text-muted); }
        .card-box {
            background: linear-gradient(135deg, #2a2010, #1e1a0e);
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(201,162,39,0.3);
            color: var(--gold-light);
        }
        .card-box strong { font-size: 16px; letter-spacing: 1px; }
        .card-box small  { color: var(--text-muted); font-size: 12px; }

        /* ── LOCATION BUTTON ── */
        .loc-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 2px dashed rgba(201,162,39,0.4);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(201,162,39,0.06);
            color: var(--gold);
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .loc-btn:hover { background: rgba(201,162,39,0.12); }
        .loc-btn.done {
            border-style: solid;
            background: rgba(46,213,115,0.08);
            border-color: #2ed573;
            color: #2ed573;
        }

        /* ── FINAL CHECKOUT ── */
        .final-checkout-btn {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--black);
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 20px rgba(201,162,39,0.45);
            letter-spacing: 0.2px;
            transition: 0.2s;
        }
        .final-checkout-btn:active { transform: scale(0.98); }
        .final-checkout-btn:disabled { opacity: 0.6; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <div class="header-logo" style="padding:0;overflow:hidden;background:none;">
                <img src="/static/cafe_logo.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="Logo">
            </div>
            <div>
                <h3>Cafe Express</h3>
                <span class="header-sub">Tez yetkazib berish</span>
            </div>
        </div>
    </div>

    <div id="promo-banner-container"></div>

    <div class="category-tabs" id="categories">
        <div class="tab skeleton" style="width: 80px; height: 35px;"></div>
        <div class="tab skeleton" style="width: 100px; height: 35px;"></div>
    </div>

    <div class="menu-list" id="menu-items">
        <div class="menu-item skeleton" style="height: 230px;"></div>
        <div class="menu-item skeleton" style="height: 230px;"></div>
    </div>

    <div class="bottom-bar" id="bottom-bar">
        <div class="cart-info">
            <span class="cart-count">🛒 <span id="cart-count">0</span> ta mahsulot</span>
            <span class="cart-total"><span id="cart-total">0</span> so'm</span>
        </div>
        <button class="checkout-btn" onclick="openModal()">Savat →</button>
    </div>

    <!-- Muvaffaqiyat Ekrani -->
    <div id="success-overlay" style="
        display:none;
        position:fixed;
        top:0;left:0;right:0;bottom:0;
        background:linear-gradient(135deg,#0d0d0d,#1a1500);
        z-index:9999;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:40px;
    ">
        <div style="
            width:110px;height:110px;
            background:linear-gradient(135deg,#c9a227,#a07c10);
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            font-size:52px;
            margin-bottom:28px;
            box-shadow: 0 0 40px rgba(201,162,39,0.5);
            animation:popIn 0.4s ease;
        ">✅</div>
        <h2 id="success-title" style="
            font-family:'Playfair Display',serif;
            color:#c9a227;
            font-size:26px;
            margin:0 0 12px;
        ">Buyurtma qabul qilindi!</h2>
        <p id="success-sub" style="color:#9a8a6a;font-size:14px;margin:0 0 12px;">Admin tasdiqlashini kutmoqda...</p>
        <p style="color:#555;font-size:12px;">Tasdiqlangach Telegramda xabar olasiz</p>
        <style>
            @keyframes popIn {
                0% { transform: scale(0); }
                80% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }
        </style>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3>🛒 Savatcha</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="cart-list" id="modal-cart-list"></div>

            <div class="payment-method">
                <p>To'lov turini tanlang:</p>
                <div class="payment-options">
                    <div class="pay-opt active" onclick="setPayment('Karta')" id="pay-karta">💳 Karta</div>
                    <div class="pay-opt" onclick="setPayment('Naqd')" id="pay-naqd">💵 Naqd</div>
                </div>
            </div>

            <div class="checkout-form">
                <input type="tel" id="form-phone" placeholder="Telefon raqam (+998901234567)" class="form-input">
                <input type="text" id="form-address" placeholder="Manzil (Tuman, ko'cha, uy...)" class="form-input">
                <button type="button" class="loc-btn" id="loc-btn" onclick="getLocation()">
                    📍 Lokatsiyani aniqlash
                </button>
                <small id="loc-status" style="display:block;margin-top:6px;color:#9a8a6a;"></small>

                <div id="card-details" class="card-details">
                    <p>Karta raqamiga pul o'tkazing:</p>
                    <div class="card-box">
                        <strong id="card-num-text">8600 0000 0000 0000</strong><br>
                        <small id="card-name-text">Ism Familiya</small>
                    </div>
                    <p style="margin-top:10px;">To'lov chekini yuklang:</p>
                    <input type="file" id="form-receipt" accept="image/*" class="form-input">
                </div>
            </div>

            <button class="final-checkout-btn" id="submit-btn" onclick="checkout()">
                Buyurtma berish — <span id="modal-total">0</span> so'm
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.colorScheme === 'dark' || true) {
            // Always dark mode for our theme
        }

        tg.MainButton.hide();

        let allItems = [];
        let cart = {};
        let globalSettings = {};
        let userLat = null;
        let userLon = null;

        function applyPromotions(menu, promotions) {
            if (!promotions || promotions.length === 0) return menu;

            promotions.forEach(p => {
                const discount = p.discount_percent || 0;
                if (discount <= 0) return;

                menu.forEach(item => {
                    const matchesItem = p.menu_item_id && Number(p.menu_item_id) === Number(item.id);
                    const matchesCategory = p.category_id && Number(p.category_id) === Number(item.category_id);
                    const isGeneral = (!p.category_id || p.category_id === '') && (!p.menu_item_id || p.menu_item_id === '');

                    if (matchesItem || matchesCategory || isGeneral) {
                        if (!item.old_price || item.old_price <= item.price) {
                            item.old_price = item.price;
                        }
                        item.price = Math.round(item.old_price * (1 - discount / 100));
                        item.promo_title = p.title;
                        item.discount_percent = discount;
                    }
                });
            });
            return menu;
        }

        function renderPromoBanner(promotions) {
            const container = document.getElementById('promo-banner-container');
            if (!container) return;
            if (!promotions || promotions.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            promotions.forEach(p => {
                html += `
                    <div style="margin: 10px 16px 6px 16px; padding: 12px 16px; background: linear-gradient(135deg, rgba(212, 175, 55, 0.18), rgba(239, 68, 68, 0.22)); border: 1px solid rgba(212, 175, 55, 0.45); border-radius: 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15);">
                        <div style="flex:1;">
                            <div style="color: #F3E5AB; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px;">
                                <span style="background:#EF4444; color:#ffffff; font-size:9.5px; font-weight:bold; padding:2px 6px; border-radius:4px; text-shadow:0 1px 2px rgba(0,0,0,0.4);">AKSIYA</span>
                                🎁 ${p.title} ${p.discount_percent ? '(' + p.discount_percent + '% Chegirma)' : ''}
                            </div>
                            <div style="color: #A39988; font-size: 11px; margin-top: 4px; line-height: 1.3;">${p.description || ''} ${p.end_date ? '• Tugash: ' + p.end_date : ''}</div>
                        </div>
                        <span style="font-size: 24px; margin-left: 8px;">🔥</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function init() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                allItems = applyPromotions(data.menu, data.promotions);
                globalSettings = data.settings;

                renderPromoBanner(data.promotions);

                document.getElementById('card-num-text').innerText = globalSettings.card_number;
                document.getElementById('card-name-text').innerText = globalSettings.card_name;

                renderCategories(data.categories);

                const savedPhone = localStorage.getItem('user_phone');
                if (savedPhone) {
                    document.getElementById('form-phone').value = savedPhone;
                }

                getLocation(true);
            } catch (e) {
                console.error("Error loading data", e);
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('categories');
            container.innerHTML = '';

            const hasPromoItems = allItems.some(i => i.old_price && i.old_price > i.price);
            if (hasPromoItems) {
                const promoDiv = document.createElement('div');
                promoDiv.className = 'tab active';
                promoDiv.innerText = '🎁 Aksiyalar';
                promoDiv.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    promoDiv.classList.add('active');
                    renderMenu('promo');
                };
                container.appendChild(promoDiv);
            }

            categories.forEach((c, index) => {
                const div = document.createElement('div');
                div.className = `tab ${(!hasPromoItems && index === 0) ? 'active' : ''}`;
                div.innerText = c.name;
                div.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    div.classList.add('active');
                    renderMenu(c.id);
                };
                container.appendChild(div);
            });

            if (hasPromoItems) {
                renderMenu('promo');
            } else if (categories.length > 0) {
                renderMenu(categories[0].id);
            }
        }

        function renderMenu(categoryId) {
            const container = document.getElementById('menu-items');
            container.innerHTML = '';

            let filtered = [];
            if (categoryId === 'promo') {
                filtered = allItems.filter(i => i.old_price && i.old_price > i.price);
            } else {
                filtered = allItems.filter(i => i.category_id === categoryId);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:#a1a1aa; width:100%;">Ushbu bo\'limda taomlar mavjud emas</div>';
                return;
            }

            filtered.forEach(item => {
                const inCart = cart[item.id] ? cart[item.id].qty : 0;

                const div = document.createElement('div');
                div.className = `menu-item ${inCart > 0 ? 'in-cart' : ''}`;
                div.id = `item-${item.id}`;

                const imgUrl = item.image_url && item.image_url.startsWith('http') ?
                               item.image_url :
                               (item.image_url ? '/static/uploads/' + item.image_url : 'https://placehold.co/300x200/1e1e1e/c9a227?text=Cafe+Express');

                const isPromo = item.old_price && item.old_price > item.price;
                const badgeHtml = isPromo ? `
                    <div style="position:absolute; top:8px; left:8px; background:linear-gradient(135deg, #EF4444, #DC2626); color:#ffffff; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:6px; box-shadow:0 2px 6px rgba(239,68,68,0.5); z-index:2; text-shadow:0 1px 2px rgba(0,0,0,0.3);">
                        🔥 AKSIYA
                    </div>
                ` : '';

                const priceHtml = isPromo ? `
                    <span class="item-price">
                        ${item.price.toLocaleString()}
                        <s style="color:#a1a1aa; font-size:11px; font-weight:normal; margin-left:4px; text-decoration:line-through; opacity:0.8;">${item.old_price.toLocaleString()}</s> so'm
                    </span>
                ` : `
                    <span class="item-price">${item.price.toLocaleString()} so'm</span>
                `;

                div.innerHTML = `
                    <div class="img-container" style="position:relative;">
                        ${badgeHtml}
                        <img src="${imgUrl}" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/300x200/1e1e1e/c9a227?text=Cafe+Express'">
                    </div>
                    <div class="item-info">
                        <div>
                            <h4 class="item-name">${item.name}</h4>
                            <p class="item-desc">${item.description || ''}</p>
                        </div>
                        <div class="price-row">
                            ${priceHtml}
                            <button class="add-btn" onclick="add(${item.id})">+</button>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="minus(${item.id})">−</button>
                                <span class="qty-val" id="qty-${item.id}">${inCart}</span>
                                <button class="qty-btn" onclick="add(${item.id})">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function add(id) {
            const item = allItems.find(i => i.id === id);
            if (!cart[id]) {
                cart[id] = { item: item, qty: 1 };
                document.getElementById(`item-${id}`).classList.add('in-cart');
            } else {
                cart[id].qty++;
            }
            document.getElementById(`qty-${id}`).innerText = cart[id].qty;
            updateCart();
            tg.HapticFeedback.impactOccurred('light');
        }

        function minus(id) {
            if (cart[id]) {
                cart[id].qty--;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                    document.getElementById(`item-${id}`).classList.remove('in-cart');
                } else {
                    document.getElementById(`qty-${id}`).innerText = cart[id].qty;
                }
                updateCart();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function updateCart() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                total += cart[id].item.price * cart[id].qty;
                count += cart[id].qty;
            }

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total.toLocaleString();
            document.getElementById('modal-total').innerText = total.toLocaleString();

            const bottomBar = document.getElementById('bottom-bar');
            if (count > 0) {
                bottomBar.classList.add('visible');
            } else {
                bottomBar.classList.remove('visible');
                closeModal();
            }
        }

        let selectedPayment = 'Karta';

        function setPayment(method) {
            selectedPayment = method;
            document.getElementById('pay-karta').classList.remove('active');
            document.getElementById('pay-naqd').classList.remove('active');
            if (method === 'Karta') {
                document.getElementById('pay-karta').classList.add('active');
                document.getElementById('card-details').style.display = 'block';
            }
            if (method === 'Naqd') {
                document.getElementById('pay-naqd').classList.add('active');
                document.getElementById('card-details').style.display = 'none';
            }
        }

        function openModal() {
            const list = document.getElementById('modal-cart-list');
            list.innerHTML = '';
            for (let id in cart) {
                const c = cart[id];
                list.innerHTML += `
                    <div class="cart-list-item">
                        <div class="cart-list-item-name">${c.item.name}</div>
                        <div class="cart-list-item-qty">${c.qty} x</div>
                        <div class="cart-list-item-price">${(c.item.price * c.qty).toLocaleString()} so'm</div>
                    </div>
                `;
            }
            document.getElementById('cart-modal').classList.add('active');

            if (!userLat || !userLon) {
                getLocation(false);
            }
        }

        function closeModal() {
            document.getElementById('cart-modal').classList.remove('active');
        }

        function getLocation(isSilent = false) {
            const btn = document.getElementById('loc-btn');
            const status = document.getElementById('loc-status');

            if (!isSilent) {
                btn.innerText = '⏳ Aniqlanmoqda...';
                status.innerText = '';
            }

            if (!navigator.geolocation) {
                if (!isSilent) {
                    status.innerText = 'Brauzeringiz geolokatsiyani qo\'llab-quvvatlamaydi.';
                    btn.innerText = '📍 Lokatsiyani aniqlash';
                }
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    btn.innerText = '✅ Lokatsiya aniqlandi!';
                    btn.classList.add('done');
                    status.innerText = `${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;

                    const addrInput = document.getElementById('form-address');
                    if (!addrInput.value) {
                        addrInput.value = `Lokatsiya: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
                    }
                },
                (err) => {
                    if (!isSilent) {
                        btn.innerText = '📍 Lokatsiyani aniqlash';
                        status.innerText = 'Ruxsat berilmadi. Manzilni qo\'lda yozing.';
                    }
                },
                { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
            );
        }

        function compressAndGetBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800;
                        let w = img.width, h = img.height;
                        if (w > MAX_SIZE || h > MAX_SIZE) {
                            if (w > h) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
                            else { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
            });
        }

        async function checkout() {
            const phone = document.getElementById('form-phone').value.trim();
            const address = document.getElementById('form-address').value.trim();

            if (!phone) {
                tg.showAlert("Iltimos, telefon raqamingizni kiriting!");
                return;
            }
            if (!address) {
                tg.showAlert("Iltimos, manzilingizni kiriting!");
                return;
            }

            const receiptInput = document.getElementById('form-receipt');
            let receiptBase64 = null;

            if (selectedPayment === 'Karta') {
                if (receiptInput.files.length === 0) {
                    tg.showAlert("Iltimos, to'lov chekini (screenshot) yuklang!");
                    return;
                }
                const btn = document.getElementById('submit-btn');
                btn.innerText = "📎 Chek tayyorlanmoqda...";
                try {
                    receiptBase64 = await compressAndGetBase64(receiptInput.files[0]);
                } catch(e) {
                    tg.showAlert("Rasm xatosi: " + e.message);
                    return;
                }
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "⏳ Tasdiqlanmoqda...";
            btn.disabled = true;

            const orderItems = Object.values(cart).map(c => ({ id: c.item.id, qty: c.qty }));
            const userId = tg.initDataUnsafe?.user?.id || '0';

            // Fonda so'rovni yuborish (keepalive webview yopilsa ham so'rovni yakunlaydi)
            fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    phone: phone,
                    address: address,
                    payment_method: selectedPayment,
                    items: orderItems,
                    latitude: userLat || 0,
                    longitude: userLon || 0,
                    receipt_base64: receiptBase64
                }),
                keepalive: true
            }).catch(e => console.error("Checkout fetch error:", e));

            tg.HapticFeedback.notificationOccurred('success');
            localStorage.setItem('user_phone', phone);
            cart = {};

            // ZUDLIK BILAN (Instant) Mini App ni yopish va Telegram chatga o'tkazish
            tg.close();
        }

        init();
    </script>
</body>
</html>
