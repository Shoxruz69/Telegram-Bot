<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish | Cafe Express & Multi-Restaurant SaaS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-dark: #997A15;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --bg-main: #0A0A0B;
      --bg-card: #141417;
      --bg-input: #1C1B20;
      --border-gold: rgba(212, 175, 55, 0.25);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #F5F5F7;
      --text-muted: #A39988;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 40%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(212, 175, 55, 0.1);
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-full);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #FFFFFF, var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--gold-primary);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-gold);
      background-color: var(--bg-input);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
      color: #0A0A0B;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 18px var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .error-box {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #F87171;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }

    .login-footer-info {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 18px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>Boshqaruv Tizimi</span>
      </div>
      <h1 class="brand-title">Tizimga Kirish</h1>
      <p class="brand-desc">Super Admin yoki Oshxona admin hisobingizga kiring</p>
    </div>

    <div class="error-box" id="error-message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span id="error-text">Login yoki parol noto'g'ri!</span>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">
          <span>Login / Foydalanuvchi nomi</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" id="username" class="form-input" placeholder="admin yoki superadmin" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          <span>Parol</span>
        </label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span>Kirish</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </form>

    <div class="login-footer-info">
      Multi-Restaurant POS & Telegram Bot Platform &copy; 2026
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const userEl = document.getElementById('username');
      const passEl = document.getElementById('password');
      const errBox = document.getElementById('error-message');
      const errTxt = document.getElementById('error-text');
      const btn = document.getElementById('submit-btn');

      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span>Tekshirilmoqda...</span>';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: userEl.value.trim(),
            password: passEl.value.trim()
          })
        });
        const data = await res.json();
        if (data.success && data.redirect) {
          window.location.href = data.redirect;
        } else {
          errTxt.textContent = data.error || "Login yoki parol noto'g'ri!";
          errBox.style.display = 'flex';
          btn.disabled = false;
          btn.innerHTML = '<span>Kirish</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>';
        }
      } catch (err) {
        errTxt.textContent = "Server bilan bog'lanishda xatolik!";
        errBox.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '<span>Kirish</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>';
      }
    }
  </script>
</body>
</html>
